<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — CALC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900:#0a0f2e; --navy-800:#0d1540; --gold:#f5c842;
      --gray-400:#8a91b8; --white:#ffffff; --glass-border:rgba(255,255,255,0.09);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',sans-serif; background:var(--navy-900);
      color:var(--white); min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:2rem;
    }
    .wrap { max-width:480px; }
    .code {
      font-family:'Syne',sans-serif; font-size:clamp(5rem,20vw,9rem);
      font-weight:800; line-height:1;
      background:linear-gradient(135deg,#f5c842,#fad96b);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:1.5rem;
    }
    h1 { font-family:'Syne',sans-serif; font-size:1.6rem; margin-bottom:1rem; }
    p  { color:var(--gray-400); margin-bottom:2rem; line-height:1.65; }
    .btn {
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.75rem 1.75rem; background:var(--gold); color:#04071a;
      border-radius:8px; font-weight:700; text-decoration:none;
      transition:background .25s, transform .25s;
    }
    .btn:hover { background:#fad96b; transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have been moved. Head back to the homepage to get started.</p>
    <a href="index.html" class="btn">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7m-9 2v8m4-8v8m5-8a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Back to Home
    </a>
  </div>
</body>
</html>
